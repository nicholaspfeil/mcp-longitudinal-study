name: Weekly repository check

# Tier 2 liveness. Asks every panel repository for its HEAD commit. Downloads
# no code -- a full clone of the panel is ~22 hours and ~28 GB, which fits
# neither a 6-hour job nor a runner's disk, while checking is ~40 minutes and
# no disk at all.
#
# Runs on a runner rather than a laptop because it spawns ~23,000 subprocesses
# over 40 minutes; local runs were repeatedly killed for memory.

on:
  schedule:
    # 08:23 UTC every Monday, about an hour after the registry snapshot.
    # Odd minute for the same reason: best-effort scheduling means ":00" is
    # the congested slot.
    - cron: "23 8 * * 1"

  workflow_dispatch:
    inputs:
      limit:
        description: "Check only the first N repos (blank = all 23,367). Use to smoke-test the workflow without re-asking 23,000 hosts."
        required: false
        default: ""
      commit:
        description: "Commit the observation. Turn OFF for a smoke test - a partial run is not a valid weekly observation and must never enter the data."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: repo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # ~40 min expected; headroom for a slow week

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Check every panel repository
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            echo "SMOKE TEST: checking only ${{ inputs.limit }} repositories."
            python -u -m scan.check_repos --workers 8 --limit "${{ inputs.limit }}"
          else
            python -u -m scan.check_repos --workers 8
          fi

      - name: Commit the observation
        # Scheduled runs always commit. Manual runs commit unless the box is
        # unticked. The condition is written explicitly rather than as
        # `inputs.commit` because on a schedule the inputs context is empty,
        # and an empty string compares equal to false in GitHub expressions --
        # which would silently stop every scheduled run from committing.
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repo-state
          if git diff --staged --quiet; then
            echo "No new observation to commit."
          else
            git commit -m "Weekly repository check ($(date -u '+%Y-%m-%dT%H:%MZ'))"
            git push
          fi

      # Last, and only on success, for the same reason as the snapshot job: a
      # run that checked but failed to commit must not report health.
      - name: Check in with the dead man's switch
        if: success()
        env:
          HEALTHCHECK_URL_REPOS: ${{ secrets.HEALTHCHECK_URL_REPOS }}
        run: |
          if [ -z "$HEALTHCHECK_URL_REPOS" ]; then
            echo "No HEALTHCHECK_URL_REPOS secret set - skipping check-in."
            echo "This job has its own check on purpose: reusing the snapshot"
            echo "job's URL would let one job's success mask the other's death."
          else
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL_REPOS" && echo "Checked in."
          fi
