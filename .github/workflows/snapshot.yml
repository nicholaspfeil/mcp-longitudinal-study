name: Weekly registry snapshot

# The observation robot. Runs itself, commits what it saw, and the commit is
# what keeps GitHub from disabling this workflow for inactivity.
#
# Anything that threatens the continuity of this schedule is a bigger decision
# than it looks. See docs/sessions.md.

on:
  schedule:
    # 07:17 UTC every Monday.
    # Odd minute on purpose: scheduled jobs are best-effort and the top of the
    # hour is congested, so ":00" schedules are the ones that get delayed.
    - cron: "17 7 * * 1"

  # Adds a "Run workflow" button in the Actions tab, so this can be tested
  # without waiting until Monday.
  workflow_dispatch:

# The default token is read-only. The job pushes its own results, so it needs
# write access to the repository contents.
permissions:
  contents: write

# Never let two snapshot runs overlap; they would race on the same push.
concurrency:
  group: registry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # A clean walk is ~6 minutes. The 2026-09-14 scheduled run took 30m23s and
    # was killed by a 30-minute limit set with what looked like 6x headroom.
    # The retry logic is why: every 5xx backs off 2/4/8/16s, and across 300+
    # pages a flaky hour compounds into hours. Budget for the bad day, not the
    # good one -- a killed run costs a week of a series that cannot be
    # backfilled, and an idle runner costs nothing on a public repo.
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12" # matches the development machine
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Fetch registry snapshot
        run: python -m scan.fetch_registry

      - name: Describe what was collected
        # Not required, but it puts the census numbers in the run log, which is
        # the cheapest possible sanity check when reading back through history.
        run: python -m scan.characterize

      - name: Commit the snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          # If nothing changed, commit would fail and fail the whole run.
          if git diff --staged --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git commit -m "Weekly registry snapshot ($(date -u '+%Y-%m-%dT%H:%MZ'))"

          # The branch may have moved while we were collecting: this job runs
          # for minutes, and a human pushing during that window makes our push
          # a non-fast-forward. That happened on 2026-09-16 and cost a whole
          # snapshot -- collected correctly, committed locally, then discarded
          # with the runner because it could not land.
          #
          # Rebasing is always safe here: this commit only ADDS a new
          # timestamped file that nothing else touches, so it cannot conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts."
          exit 1

      # MUST be the last step. "Success" means the snapshot was fetched AND
      # committed; checking in before the push would report health for a run
      # whose data never got saved.
      - name: Check in with the dead man's switch
        # Runs only if every step above succeeded. A failed run must NOT check
        # in, or the alarm reports health while the collector is broken.
        # GitHub emails on failure; this catches the other case, where the run
        # never happens at all and nothing is emitted to notice. Lives outside
        # GitHub on purpose - a monitor inside the system it monitors cannot
        # detect that system being down.
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "No HEALTHCHECK_URL secret set - skipping check-in."
            echo "See docs/next-step.md for how to set this up."
          else
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" && echo "Checked in."
          fi

      # Report failure immediately instead of waiting for the weekly period to
      # lapse. With a 1-week period and 1-day grace, a Monday failure would not
      # be reported until the following Thursday -- nine days of silence on the
      # collector whose data cannot be backfilled. Pinging /fail turns the
      # check red now.
      #
      # Note this cannot catch a job killed by the job-level timeout, since
      # GitHub cancels remaining steps. The timeout headroom above is the
      # defence against that case.
      - name: Report failure to the dead man's switch
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HEALTHCHECK_URL%/}/fail" && echo "Reported failure."
          fi
